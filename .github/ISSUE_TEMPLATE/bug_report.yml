name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Mod version
      description: First line of TheysGone.log, e.g. "Theys Gone X.Y.Z starting (protocol vN)"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows, Linux (Proton), Steam Deck, Other]
    validations:
      required: true
  - type: dropdown
    id: transport
    attributes:
      label: Transport
      options: [Steam, LAN UDP]
    validations:
      required: true
  - type: dropdown
    id: setup
    attributes:
      label: Setup
      options: [Two PCs, Two games on one PC]
    validations:
      required: true
  - type: input
    id: settings
    attributes:
      label: Relevant TheysGone.ini values
      description: HostSave, FreeRoam and MissionObjectiveSync on both PCs, e.g. "host HostSave=1 FreeRoam=0 MissionObjectiveSync=0; guest the same"
  - type: dropdown
    id: save-guard
    attributes:
      label: Was the guest's save guard active?
      description: >-
        Yes if the guest's log has "save guard: guest save sandbox active until restart"
        and it did not show "Join blocked: the save sandbox failed".
      options: ["Yes", "No", "Unknown"]
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: TheysGone.log (both players if possible)
      description: Redact player names, account IDs, IP addresses and local paths before posting. Never include saves, credentials or tokens.
      render: text
